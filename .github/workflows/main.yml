name: Pipeline Integrado CI/CD De Cero a Produccion

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:

  job-ci:

    name: 1. Integracion Continua (Linter y Tests)

    runs-on: ubuntu-latest

    steps:

      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Linter (Flake8)
        run: flake8 app.py test_app.py

      - name: Ejecutar Pruebas Unitarias (PyTest)
        run: pytest -v

  job-build-docker:

    name: 2. Build de Imagen Inmutable Docker

    needs: job-ci

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3

      - name: Compilar Imagen Docker
        run: |
          docker build -t microservicio:v1 .
          docker images | grep microservicio

  job-cd-multistage:

    name: 3. Despliegue Multietapa

    needs: [job-ci, job-build-docker]

    runs-on: ubuntu-latest

    steps:

      - name: Deploy DEV
        run: echo "[DEV] OK"

      - name: Deploy TEST
        run: echo "[TEST] OK"

      - name: Deploy PROD
        if: github.ref == 'refs/heads/main'
        run: echo "[PROD] OK"